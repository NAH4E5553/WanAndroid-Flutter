name: Stage 5 checks

"on":
  pull_request:

permissions:
  contents: read

concurrency:
  group: stage4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  classify-changes:
    name: Classify PR changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      platform: ${{ steps.classify.outputs.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 .github/scripts/classify_pr_changes.py
          --base "$BASE_SHA"
          --output "$GITHUB_OUTPUT"
      - name: Verify pull request contract
        env:
          CODE_CHANGED: ${{ steps.classify.outputs.code }}
        run: >-
          python3 .github/scripts/verify_pr_contract.py
          --event "$GITHUB_EVENT_PATH"
          --code "$CODE_CHANGED"

  analyze-and-test:
    name: Analyze and Test
    needs: classify-changes
    if: needs.classify-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CI and OCR configuration
        run: |
          python -m pip install -r .github/tests/requirements.txt
          python .github/scripts/prepare_ocr_action.py
          python -m unittest discover -s .github/tests -v
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart --packages=tool/standalone_package_config.json tool/generate_launcher_icons.dart
      - run: git diff --exit-code
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart --packages=tool/standalone_package_config.json tool/analyze_project.dart
      - run: dart --packages=tool/standalone_package_config.json tool/verify_architecture.dart
      - run: dart --packages=tool/standalone_package_config.json tool/verify_architecture_fixtures.dart
      - run: dart --packages=tool/standalone_package_config.json tool/verify_sensitive_data.dart
      - run: dart --packages=tool/standalone_package_config.json tool/verify_sensitive_data_fixtures.dart
      - run: dart --packages=tool/standalone_package_config.json tool/verify_stage1.dart
      - run: dart --packages=tool/standalone_package_config.json tool/verify_stage2.dart
      - run: dart --packages=tool/standalone_package_config.json tool/verify_stage3.dart
      - run: dart --packages=tool/standalone_package_config.json tool/verify_stage4.dart
      - run: dart --packages=tool/standalone_package_config.json tool/verify_stage5.dart
      - run: flutter analyze
      - run: flutter test --coverage

  android-integration:
    name: Android Integration
    needs: classify-changes
    if: needs.classify-changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache Android virtual device
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api-35-x86_64-v1
      - name: Create Android virtual device snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Android virtual device snapshot created"
      - name: Run Android integration suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test/stage5_ci_test.dart -d emulator-5554 --no-pub --reporter expanded

  android-shell:
    name: Android APK
    needs: classify-changes
    if: needs.classify-changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - run: flutter build apk --debug --no-pub

  ios-integration:
    name: iOS Integration
    needs: classify-changes
    if: needs.classify-changes.outputs.platform == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Select and boot an iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )
          for runtime, devices in payload["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator")
          PY
          )
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Run iOS integration suite
        run: >-
          flutter test integration_test/stage5_ci_test.dart
          -d "${{ steps.simulator.outputs.device_id }}"
          --no-pub --reporter expanded

  ios-shell:
    name: iOS Simulator
    needs: classify-changes
    if: needs.classify-changes.outputs.platform == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --no-pub
