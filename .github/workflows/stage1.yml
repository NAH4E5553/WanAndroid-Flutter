name: Stage 1 checks

on:
  pull_request:
  push:

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart --packages=tool/standalone_package_config.json tool/generate_launcher_icons.dart
      - run: git diff --exit-code -- android/app/src/main/res ios/Runner/Assets.xcassets/AppIcon.appiconset
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart --packages=tool/standalone_package_config.json tool/analyze_project.dart
      - run: dart --packages=tool/standalone_package_config.json tool/verify_architecture.dart
      - run: dart --packages=tool/standalone_package_config.json tool/verify_architecture_fixtures.dart
      - run: dart --packages=tool/standalone_package_config.json tool/verify_stage1.dart
      - run: flutter analyze
      - run: flutter test --coverage

  android-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: flutter test integration_test/navigation_restoration_test.dart -d emulator-5554

  android-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build apk --debug

  ios-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build ios --simulator --debug
