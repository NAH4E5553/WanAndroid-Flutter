name: wanandroid_flutter
description: WanAndroid Flutter application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  json_annotation: ^4.12.0
  path: ^1.9.1
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  freezed: ^4.0.1
  go_router_builder: ^4.5.0
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9

# WanAndroid Flutter local patch (stage 4, 2026-09-21): vendored
# webview_flutter_android 4.14.1 with an onRenderProcessGone override that
# keeps the app alive on renderer death and reports
# WebResourceErrorType.webContentProcessTerminated to Dart (API 26+). See
# third_party/webview_flutter_android/README.local-patch.md. Upstream has no
# such callback as of 4.14.1; revisit on every plugin upgrade.
dependency_overrides:
  webview_flutter_android:
    path: third_party/webview_flutter_android

flutter:
  uses-material-design: true
